<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Goth - Entrar</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--goth-black-void);
    }
    .auth-box {
      background: var(--goth-dark-gray);
      border: 1px solid var(--goth-border);
      padding: 32px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-box h2 {
      color: #fff;
      margin-bottom: 20px;
      font-family: var(--font-gothic, sans-serif);
    }
    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .input-group label {
      display: block;
      color: var(--goth-silver-ghost);
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    .input-group input {
      width: 100%;
      padding: 10px;
      background: var(--goth-card-gray);
      border: 1px solid var(--goth-border);
      border-radius: 6px;
      color: #fff;
      outline: none;
    }
    .btn-auth {
      width: 100%;
      padding: 12px;
      background: var(--goth-blood);
      border: 1px solid var(--goth-blood-bright);
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-auth:hover {
      background: var(--goth-blood-bright);
    }
    .auth-toggle {
      margin-top: 16px;
      color: var(--goth-silver-ghost);
      font-size: 0.85rem;
      cursor: pointer;
    }
    .auth-toggle span {
      color: var(--goth-blood-bright);
      text-decoration: underline;
    }
    .error-msg {
      color: #ff4d4d;
      font-size: 0.85rem;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">Entrar no Spotify Goth</h2>
      <div id="error-msg" class="error-msg"></div>

      <form id="auth-form">
        <div class="input-group">
          <label>E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="senha" required placeholder="******">
        </div>
        <button type="submit" id="btn-submit" class="btn-auth">Entrar</button>
      </form>

      <div class="auth-toggle" id="toggle-auth">
        Não tem uma conta? <span id="toggle-text">Cadastre-se</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { logarUsuario, cadastrarUsuario, escutarAutenticacao } from './js/auth.js';

    let modoCadastro = false;

    const form = document.getElementById('auth-form');
    const title = document.getElementById('auth-title');
    const btnSubmit = document.getElementById('btn-submit');
    const toggleAuth = document.getElementById('toggle-auth');
    const toggleText = document.getElementById('toggle-text');
    const errorMsg = document.getElementById('error-msg');

    // Se já estiver logado, redireciona diretamente para a Home
    escutarAutenticacao(user => {
      if (user) window.location.href = 'index.html';
    });

    toggleAuth.addEventListener('click', () => {
      modoCadastro = !modoCadastro;
      title.innerText = modoCadastro ? 'Criar Conta' : 'Entrar no Spotify Goth';
      btnSubmit.innerText = modoCadastro ? 'Cadastrar' : 'Entrar';
      toggleText.innerText = modoCadastro ? 'Faça login' : 'Cadastre-se';
      errorMsg.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;

      try {
        if (modoCadastro) {
          await cadastrarUsuario(email, senha);
        } else {
          await logarUsuario(email, senha);
        }
        window.location.href = 'index.html';
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
